# Installed to /etc/sudoers.d/zz-steam-machine (no extension -- sudo skips any
# file whose name contains a dot, so the repo copy is named .conf for the
# editor's benefit and install.sh strips it).
#
# The `zz` prefix is required for the NOPASSWD rules below to have any effect.
# sudo reads /etc/sudoers.d in LEXICAL order and applies LAST MATCH WINS.
# SteamOS ships /etc/sudoers.d/wheel containing `%wheel ALL=(ALL) ALL`, and deck
# is in wheel -- so any NOPASSWD rule in a file sorting before `wheel` is matched
# and then silently overridden by that later, password-requiring rule. It
# parses, `visudo -c` is happy, and the prompt simply keeps coming.
#
# `10-` was the original name and lost. `99-` was the first attempt at a fix and
# ALSO lost: digits sort before letters, so `99-steam-machine` still precedes
# `wheel`. A numeric prefix cannot win against a letter-named file. `zz-` sorts
# after `wheel` and `wheel-prepare-oobe-test`, which is the whole point.
#
# Check with `sudo -U deck -l` after any change: the rules print in parse order,
# so our NOPASSWD line must appear BELOW the `(ALL) ALL` line, not above it.
#
# See system/sudo/README.md. Validated with `visudo -cf` before installation,
# and the whole set re-validated afterwards with a rollback on failure.

## Cache the password across shells, not per-terminal.
##
## sudo's default timestamp_type is `tty`: the credential record is keyed on
## the controlling terminal. Anything running without one -- Game Mode, an
## agent shell, a script -- has no tty to key on, so sudo falls back to the
## PARENT PROCESS ID. Every new shell is a new ppid, so the cache never
## matches and every single sudo re-prompts. On this machine that means a
## ksshaskpass dialog on the TV for each command in a sequence.
##
## `global` keys the record on the user instead: one record in /run/sudo/ts,
## shared by every shell that user owns.
Defaults:deck timestamp_type=global

## Five minutes is not enough to get through one install run, and fifteen is
## not enough to cover an interactive session over ssh -- the dialog still
## lands on the TV, which is exactly where nobody is sitting when working
## remotely. Six hours covers a working session; /run is tmpfs, so the record
## is still discarded at every reboot regardless.
Defaults:deck timestamp_timeout=360

## Commands allowed without a password.
##
## The two that actually recur. Absolute paths, never bare names: a bare name
## would leave it to PATH to decide which binary runs as root.
##
## dmesg and journalctl are read-only, and are most of what an agent shell wants
## root for -- reading the kernel ring buffer and the previous boot's journal.
## Caveat recorded rather than hidden: run interactively on a terminal both page
## through less, and less has a shell escape (`!sh`), so this is a root shell for
## anyone already sitting at a deck session. That is not a new capability here --
## deck is in wheel with (ALL) ALL -- so it is accepted, not defended against.
Cmnd_Alias SM_LOGS = /usr/bin/dmesg, /usr/bin/journalctl

deck ALL=(root) NOPASSWD: SM_LOGS

## Host-local rules, if any, live in a separate drop-in sorting after this one
## and are deliberately not in this repo. Nothing here depends on them.
