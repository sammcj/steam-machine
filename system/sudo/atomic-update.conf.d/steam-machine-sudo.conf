# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. It covers
# /etc/passwd, /etc/group and /etc/shadow -- but NOT /etc/sudoers.d. Without
# this entry the timestamp settings are dropped on the next A/B update and
# every sudo starts re-prompting again, with no error to explain it.
#
# The specific file, never the directory: an allowlisted path shadows all
# future upstream versions of it forever, and SteamOS ships four of its own
# drop-ins into /etc/sudoers.d (no-fqdn, sudo, wheel, wheel-prepare-oobe-test).
/etc/sudoers.d/zz-steam-machine
