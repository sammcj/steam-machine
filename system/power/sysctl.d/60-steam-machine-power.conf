# Idle power tunables. Installed to /etc/sysctl.d/60-steam-machine-power.conf.
#
# Both come from `powertop --html` on 2026-08-03. Only these two of powertop's
# ~45 suggestions survived triage -- see ../README.md for what was rejected and
# why, which is the more useful half of this subsystem.
#
# Applied at boot by systemd-sysctl.service (sysinit.target). That is far
# earlier than steam-machine-power.service can run, so the boot self-heal in
# install.sh --boot re-applies these values itself rather than only restoring
# the file; otherwise the first boot after an A/B update that dropped the file
# would run without them.

# The NMI watchdog arms a per-CPU perf counter whose only job is to detect hard
# lockups and panic. It is a kernel-debugging feature: on a console it costs a
# periodic NMI on all 8 cores forever and buys nothing anybody will ever read.
#
# Runtime-writable, so this is reversible without a reboot -- `sysctl -w
# kernel.nmi_watchdog=1` puts it back. That is why it is set here rather than
# via nmi_watchdog=0 on the kernel cmdline, which would need a grub.d drop-in,
# a reboot to apply, and another reboot to test a revert.
kernel.nmi_watchdog = 0

# Default is 500 (5 s). Raising it to 15 s lets dirty page writeback batch up,
# which removes wb_workfn wakeups from the idle timer load.
#
# Honestly marginal here: the saving is real but small, because the backing
# store is NVMe and zram rather than a disk that could spin down -- the classic
# reason this knob exists. The cost is the matching one: up to 15 s of dirty
# data unflushed instead of 5 s if the machine loses power uncleanly. Acceptable
# for a games console, and it would not be for a machine holding work in
# progress.
vm.dirty_writeback_centisecs = 1500
