# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. Verified on
# 2026-08-03: that list contains no /etc/sysctl.d entry of any kind, so without
# this line the tunables are silently dropped on the next A/B update.
#
# The failure mode is the quiet sort: nothing errors, nothing logs, the machine
# just goes back to arming the NMI watchdog on all 8 cores and nobody notices
# until someone runs powertop again and re-derives the same conclusion.
#
# /etc/udev/rules.d is not on the list either, so the SATA link power
# management rule needs the same treatment. Losing that one is quieter still:
# the links just go back to the firmware default and nothing anywhere says so.
#
# The specific files, never the directories: an allowlisted path shadows all
# future upstream versions of it forever, and both /etc/sysctl.d and
# /etc/udev/rules.d are directories SteamOS itself ships into.
#
# /etc/atomic-update.conf.d/*.conf is itself on the default keep list, so this
# file preserves itself. The systemd unit is covered by the default list's
# /etc/systemd/system/*.service and its enable symlink by *.wants/**.
/etc/sysctl.d/60-steam-machine-power.conf
/etc/udev/rules.d/60-steam-machine-power.rules
