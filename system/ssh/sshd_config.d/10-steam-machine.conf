# SSH policy for the Steam Machine.
#
# Drop-ins in /etc/ssh/sshd_config.d/ are included from the top of
# sshd_config and the FIRST value set for a keyword wins, so the "10-"
# prefix makes this file take precedence over 99-archlinux.conf and
# over the commented defaults further down sshd_config.

# Only the deck user may log in over SSH.
AllowUsers deck
PermitRootLogin no

# TODO: set to "no" once key-based auth is set up on every client that
# needs to reach this box. Before flipping it, confirm a key login
# actually works (ssh-copy-id, then log in without being prompted) —
# otherwise this turns into a lockout, since there is no other remote
# way in. KbdInteractiveAuthentication is already "no" via
# 99-archlinux.conf, so password auth is the only thing left to close.
PasswordAuthentication yes

PubkeyAuthentication yes
PermitEmptyPasswords no

# --- Dead-session detection -------------------------------------------------
#
# sshd sends an encrypted keepalive every ClientAliveInterval seconds and gives
# up after ClientAliveCountMax unanswered ones. Both default to off
# (ClientAliveInterval 0), which means a session whose client vanished -- laptop
# lid closed, Wi-Fi dropped, VPN flapped -- stays registered with logind
# forever.
#
# That is not merely untidy here. hardware/sleep/ holds a sleep inhibitor for as
# long as any sshd session exists, so a single abandoned session would keep the
# machine awake indefinitely and the fault would look like "the keepawake
# daemon is broken" rather than "there is a zombie session". These two settings
# are what bound that. See hardware/sleep/README.md.
#
# 60 x 5 = five minutes of unanswered keepalives before the session is torn
# down. That is deliberately tolerant: it rides out a brief Wi-Fi drop or a
# router reboot without killing a live session, while still reaping a genuinely
# dead one well inside the two-hour grace window. It also keeps NAT and
# stateful-firewall mappings warm, which stops idle sessions being silently
# blackholed by the router.
#
# The trade-off: a client that suspends for longer than five minutes loses its
# session. That is the correct outcome for the inhibitor, and the right fix for
# long-lived work is tmux on this end rather than a longer timeout.
ClientAliveInterval 60
ClientAliveCountMax 5
