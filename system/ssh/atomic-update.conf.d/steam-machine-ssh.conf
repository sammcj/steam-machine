# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. For /etc/ssh
# it keeps exactly two globs:
#
#   /etc/ssh/*_key
#   /etc/ssh/*_key.pub
#
# Host keys, and nothing else. The server *configuration* is not on the list, so
# without this entry /etc/ssh/sshd_config.d/10-steam-machine.conf is silently
# deleted by the next A/B update and sshd falls back to stock Arch defaults:
#
#   AllowUsers deck          -> gone; every account on the box may log in
#   PermitRootLogin no       -> gone; falls back to prohibit-password, so root
#                               with an authorized_keys entry could log in
#   ClientAliveInterval 60   -> gone; back to 0, dead sessions never reaped,
#                               and hardware/sleep/ pins the machine awake on
#                               the first abandoned session
#
# The first two are a quiet loosening of access policy with no symptom at all --
# nothing breaks, nothing is logged, it simply becomes less locked down. That is
# the worst kind of thing to leave unpinned.
#
# The specific file, never /etc/ssh/* or the sshd_config.d directory: an
# allowlisted path shadows all future upstream versions of it forever, and
# /etc/ssh is very much a directory that openssh and SteamOS both ship into --
# pinning it wholesale would freeze this machine's sshd_config, moduli and
# host-key configuration at today's versions permanently.
#
# Note 99-archlinux.conf and the symlinked 20-systemd-userdb.conf are NOT listed
# here: both are package-owned, so an update reinstalls them itself.
#
# /etc/atomic-update.conf.d/*.conf is itself on the default keep list, so this
# file preserves itself.
/etc/ssh/sshd_config.d/10-steam-machine.conf
