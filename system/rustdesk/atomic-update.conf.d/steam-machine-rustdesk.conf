# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. It covers
# /etc/systemd/system/*.service, so rustdesk.service survives an A/B update on
# its own. It does NOT cover /etc/polkit-1/rules.d.
#
# Without this entry the rule that lets `deck` start and stop rustdesk.service
# is silently dropped on the next OS update, and the failure mode is a service
# that simply never comes up in Desktop Mode: the user unit runs, its
# `systemctl start` is refused with "Interactive authentication required", and
# the oneshot fails in the *user* manager -- so `systemctl status rustdesk`,
# the first place anyone looks, reports a perfectly healthy inactive unit with
# nothing wrong in its journal.
#
# The other three pieces of this subsystem need no entry, for three different
# reasons, and it is worth writing down so nobody adds them here later:
#
#   /etc/systemd/system/rustdesk.service   already on the default keep list
#   ~/.config/systemd/user/rustdesk-desktop-mode.service (and its .wants
#                                          symlink) -- /home is not touched by
#                                          an A/B update at all
#   /usr/bin/rustdesk, /usr/share/rustdesk WIPED by every update, deliberately
#                                          not preserved: install.sh --boot
#                                          restores them from the cache under
#                                          /home, and it now runs from the
#                                          service's own ExecStartPre, i.e. on
#                                          entry to Desktop Mode rather than at
#                                          boot. That is when they are needed,
#                                          and it is the only time the service
#                                          is allowed to start.
#
# The specific file, never the directory: an allowlisted path shadows all
# future upstream versions of it forever, and /etc/polkit-1/rules.d is a
# directory that packages ship into.
#
# /etc/atomic-update.conf.d/*.conf is itself on the default keep list, so this
# file preserves itself.
/etc/polkit-1/rules.d/60-steam-machine-rustdesk.rules
