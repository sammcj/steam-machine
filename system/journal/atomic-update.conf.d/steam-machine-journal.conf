# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. Verified on
# 2026-08-17: it contains no /etc/systemd/journald.conf.d entry, and no
# /etc/systemd/** wildcard either -- the systemd entries on that list are
# specific to /etc/systemd/system/*.{service,socket,mount} and their drop-in
# and .wants/.requires directories. So without this line the drop-in is
# silently dropped on the next A/B update.
#
# The failure mode is quiet and self-concealing: journald falls back to Valve's
# SystemMaxUse=50M, the journal silently shrinks to a ~2 day window, and the
# only symptom is that the next time someone goes looking for the evidence of an
# overnight fault it is not there -- which reads as "nothing was logged" rather
# than "the log was truncated".
#
# The specific file, never the directory: an allowlisted path shadows all future
# upstream versions of it forever, and /etc/systemd/journald.conf.d is a
# directory SteamOS itself could ship into.
#
# /etc/atomic-update.conf.d/*.conf is itself on the default keep list, so this
# file preserves itself. The systemd unit is covered by the default list's
# /etc/systemd/system/*.service and its enable symlink by *.wants/**.
/etc/systemd/journald.conf.d/zz-steam-machine-journal.conf
