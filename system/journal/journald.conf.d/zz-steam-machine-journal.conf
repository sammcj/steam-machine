# Installed to /etc/systemd/journald.conf.d/zz-steam-machine-journal.conf
#
# The journal is already persistent here -- SteamOS ships
# /usr/lib/systemd/journald.conf.d/persistent-store.conf with Storage=persistent
# and /var/log/journal exists. What it is not is *long*: a companion drop-in,
# system-max-use.conf, sets SystemMaxUse=50M, and at this machine's measured
# ~23 MB/day that buys about two days before the oldest entries are vacuumed.
#
# Two days is shorter than the problems. An overnight fault -- the machine not
# suspending, a UI thread stall accumulating for twelve hours -- is typically
# noticed the following evening, by which point the window that would explain it
# has already been deleted.
#
# The 'zz-' prefix is required, not cosmetic. systemd sorts drop-ins by filename
# in lexicographic order across *all* the directories they live in, and the file
# sorted last wins; the /etc-over-/usr precedence rule only applies between
# files with the same name. Valve's are persistent-store.conf and
# system-max-use.conf, so a conventional numeric prefix would lose -- '9' (0x39)
# sorts before 'p' (0x70) and this file would be silently overridden by the very
# setting it exists to replace. 'zz-' sorts after both. Verify with
# `install.sh --status`, which reads the merged config back rather than assuming.

[Journal]
# Explicit rather than inherited. Costs nothing and means this file states the
# whole policy, so it still does the right thing if Valve ever drops their
# persistent-store.conf.
Storage=persistent

# The retention Sam asked for: anything older than a week goes.
#
# Enforced at rotation and at journald start, not continuously, and it can only
# delete *whole files* -- a file is dropped when its newest entry is older than
# the limit. That is why SystemMaxFileSize is pinned below.
MaxRetentionSec=1week

# Backstop, not the primary limit. At ~23 MB/day a week is ~160 MB, so
# MaxRetentionSec binds first and this only matters if something starts logging
# far harder than it does today -- in which case a bounded journal is exactly
# what is wanted. 512 MB against 753 GB free on nvme0n1p8 is not a disk risk.
SystemMaxUse=512M

# Retention granularity. Left unset this defaults to 1/8 of SystemMaxUse (64 MB
# = ~3 days per file here), and since whole files are the unit of deletion, a
# 1-week policy would in practice keep up to ~10 days. At 32 MB a file spans
# ~1.4 days and the week is honoured to within about that.
SystemMaxFileSize=32M
