# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. It covers
# /etc/systemd/system/*.service (so input-remapper.service and the self-heal
# unit are safe on their own) but NOT /etc/dbus-1/system.d or
# /etc/udev/rules.d. Without the entries below, an A/B update leaves the
# daemon unable to own its name on the system bus -- input-remapper-gtk then
# fails to connect with no useful error -- and kills hotplug autoload.
#
# The specific files, never the directories: an allowlisted path shadows all
# future upstream versions of it forever, and both are directories SteamOS
# itself ships into.
/etc/dbus-1/system.d/inputremapper.Control.conf
/etc/udev/rules.d/69-input-remapper-forwarded.rules
/etc/udev/rules.d/99-input-remapper.rules
