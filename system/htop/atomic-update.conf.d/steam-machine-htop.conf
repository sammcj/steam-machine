# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. Nothing in
# it covers /etc/htoprc, so without this entry the system-wide htop defaults
# are silently deleted by the next A/B update.
#
# Why /etc/htoprc matters here: htop reads, in order,
#
#   $HTOPRC
#   $XDG_CONFIG_HOME/htop/htoprc
#   ~/.config/htop/htoprc
#   ~/.htoprc
#   /etc/htoprc                      <- read-only fallback, this file
#
# /etc/htoprc is how root, and any other account without its own config, gets
# this machine's htop layout -- one config to maintain instead of one per
# account.
#
# Neither home directory is at risk from an OS update: /home is a separate
# partition (nvme0n1p8, ext4), and /root is a SteamOS offload mount on that
# same partition (/dev/nvme0n1p8[/.steamos/offload/root]). /etc is the part
# that is at risk -- it is an overlayfs whose upper layer lives in /var, and an
# atomic update discards that upper layer except for the allowlisted paths
# below. Hence this file.
#
# The specific file, never /etc/* or a directory: an allowlisted path shadows
# all future upstream versions of it forever. /etc/htoprc is owned by no
# package and ships with nothing, so pinning this one file shadows nothing.
#
# /etc/atomic-update.conf.d/*.conf is itself on the default keep list, so this
# file preserves itself.
/etc/htoprc
