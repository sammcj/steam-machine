# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. It covers
# /etc/systemd/system/*.service (so both units here survive) but NOT
# /etc/udev/rules.d -- so without this entry the rule that pins runtime PM off
# on the xHCI controllers is silently dropped on the next A/B update, and the
# next hub storm wedges the controller again with no obvious cause.
#
# The specific file, never the directory: an allowlisted path shadows all
# future upstream versions of it forever, and /etc/udev/rules.d is a directory
# SteamOS itself ships into.
/etc/udev/rules.d/60-steam-machine-usb.rules
