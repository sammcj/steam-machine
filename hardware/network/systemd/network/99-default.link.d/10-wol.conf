# Wake-on-LAN for the onboard RTL8125D. Installed to
# /etc/systemd/network/99-default.link.d/10-wol.conf
#
# A DROP-IN on systemd's shipped 99-default.link, deliberately not a new .link
# file of our own. udev's link_get_config() returns on the FIRST .link file
# whose [Match] hits, so a file sorting earlier -- say 10-wol.link -- would
# displace 99-default.link wholesale and take its settings with it:
#
#     NamePolicy=keep kernel database onboard slot path
#     AlternativeNamesPolicy=database onboard slot path mac
#     MACAddressPolicy=persistent
#
# Losing NamePolicy renames the interface. enp9s0 becomes eth0, and every
# NetworkManager profile bound to the old name stops matching -- on the only
# machine reachable solely over that interface. A drop-in merges into the
# existing file instead and touches nothing but WakeOnLan.
#
# No [Match] section: drop-ins inherit the parent's, which is the catch-all in
# 99-default.link. There is only one physical NIC in this box (the MediaTek
# WN00 wireless is a separate driver and unused), so scoping this by MAC would
# add a failure mode -- a replaced board silently loses WoL -- without adding
# any safety.
[Link]
# magic == WAKE_MAGIC only. Deliberately NOT `phy`, which wakes the machine on
# link-up: every switch reboot or cable reseat would power the box on.
#
# Deliberately no WakeOnLanPassword= and no `secureon` either. r8169's
# rtl8169_set_wol() does `if (wol->wolopts & ~WAKE_ANY) return -EINVAL;` and
# WAKE_ANY excludes WAKE_MAGICSECURE -- so setting a password does not weaken
# WoL, it makes the entire ioctl fail and nothing gets armed at all.
WakeOnLan=magic
