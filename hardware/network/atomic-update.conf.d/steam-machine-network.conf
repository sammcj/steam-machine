# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. It covers
# /etc/systemd/system/*.service and *.wants/**, so steam-machine-network.service
# and its enable symlink survive on their own.
#
# It does not cover /etc/systemd/network. Without this entry the WoL drop-in is
# silently dropped on the next A/B update and the machine simply stops waking --
# no error, no log line, nothing to notice until the day you try to wake it and
# have to walk to the TV.
#
# The other half of this subsystem, the NetworkManager wake-on-lan property,
# needs no entry: /etc/NetworkManager/system-connections/* IS on the default
# keep list, so it survives for free. That asymmetry is the reason both halves
# exist -- see README.md. If this entry is ever lost, NM still re-arms WoL on
# the next connection activation, so the failure degrades rather than being
# total.
#
# The specific file, never the directory: an allowlisted path shadows all
# future upstream versions of it forever, and /etc/systemd/network is a
# directory systemd itself ships into.
#
# /etc/atomic-update.conf.d/*.conf is itself on the default keep list, so this
# file preserves itself.
/etc/systemd/network/99-default.link.d/10-wol.conf
