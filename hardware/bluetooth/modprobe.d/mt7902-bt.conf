# Onboard MediaTek MT7902 Bluetooth (USB 0e8d:7902).
#
# The in-tree btusb matches this device via its generic Bluetooth-class entry
# and fails on it ("Unsupported hardware variant (00007902)"), leaving the
# controller DOWN. Load our out-of-tree module first so it wins the race to
# claim the device.
#
# btusb_mt7902's match table is deliberately narrowed to 0e8d:7902 only, so
# this cannot affect the Realtek USB dongle or any other adapter — those stay
# with the in-tree btusb.
softdep btusb pre: btusb_mt7902
