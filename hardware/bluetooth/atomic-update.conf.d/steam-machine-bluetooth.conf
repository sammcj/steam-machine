# Installed to /etc/atomic-update.conf.d/.
#
# The default keep list (/usr/lib/rauc/atomic-update-keep.conf) covers
# /etc/systemd/system/*.service and /etc/systemd/system/*.wants/**, so
# mt7902-bt.service and its enable symlink both carry across a SteamOS A/B
# update on their own.
#
# It does NOT cover /etc/modprobe.d. Without this entry, mt7902-bt.conf --
# and with it the `softdep btusb pre: btusb_mt7902` that stops the in-tree
# btusb claiming the device first -- is silently dropped on the next OS update.
# The service's own comment relies on that file for load ordering.
#
# Failure mode without this is subtle rather than total: mt7902-bt.service
# still runs and bind_device() explicitly unbinds the device from btusb and
# rebinds it to btusb_mt7902, so Bluetooth usually still comes up. But the
# first line of defence is gone, and the window where btusb owns the device
# and logs "Unsupported hardware variant (00007902)" is real.
#
# /etc/atomic-update.conf.d/*.conf is itself on the default keep list, so this
# file preserves itself.
#
# The specific file is listed, not /etc/modprobe.d/*: an allowlisted path
# shadows all future upstream versions of it forever, which is harmless for a
# file we own outright but a trap for a whole directory.
/etc/modprobe.d/mt7902-bt.conf
