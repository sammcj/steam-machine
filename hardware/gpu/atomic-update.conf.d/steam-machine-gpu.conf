# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. It does not
# cover /etc/modprobe.d, so without this entry LACT's overdrive config is
# silently dropped on the next A/B update and every overclocking, fan-curve and
# power-limit control in LACT goes back to greyed-out -- with no error, just
# LACT offering to "enable overclocking" again as if it had never been done.
#
# This is not hypothetical: the file was recovered from
# /var/lib/steamos-atomupd/etc_backup/2026-08-01_21-38-35.tar.xz, the snapshot
# SteamOS takes of /etc immediately before discarding it. It had been set, and
# that update ate it.
#
# The specific file, never the directory: an allowlisted path shadows all
# future upstream versions of it forever, and /etc/modprobe.d is a directory
# SteamOS itself ships into.
/etc/modprobe.d/99-amdgpu-overdrive.conf
