# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. It covers
# /etc/systemd/system/*.service and *.wants/**, so both units in this subsystem
# -- steam-machine-keepawake.service, steam-machine-sleep-inhibit.service and
# the enable symlink for the first -- survive an A/B update on their own.
#
# It does NOT cover /etc/polkit-1/rules.d. Without this entry the rule that
# lets `deck` take a sleep inhibitor is silently dropped on the next OS update.
#
# The failure mode is partial and easy to misread, which is why it is worth
# spelling out: the automatic half of this subsystem keeps working perfectly,
# because keepawake-daemon runs as root and root bypasses polkit entirely. Only
# the interactive `keepawake` shell function breaks -- and it breaks by hanging
# on an unanswerable password prompt rather than by printing an error.
#
# The specific file, never the directory: an allowlisted path shadows all
# future upstream versions of it forever, and /etc/polkit-1/rules.d is a
# directory that packages ship into.
#
# /etc/atomic-update.conf.d/*.conf is itself on the default keep list, so this
# file preserves itself.
/etc/polkit-1/rules.d/60-steam-machine-inhibit.rules
