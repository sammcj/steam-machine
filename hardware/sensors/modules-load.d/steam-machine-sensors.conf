# Sensor drivers that exist in the SteamOS kernel but are not auto-loaded,
# plus the out-of-tree it87. Installed to /etc/modules-load.d/.
# Loaded early by systemd-modules-load.service.

# SATA SSD temperatures (the two Crucial MX500s). Nothing auto-loads this.
drivetemp

# DDR5 SPD hub temperature sensors. Also claims i2c 0x50-0x57 so userspace
# cannot reach the unprotected SPD EEPROMs -- see modprobe.d/ for why that
# matters and why load order is enforced separately.
spd5118

# ITE IT8696E Super I/O: the only source of fan RPM, Vcore and VRM temp on
# this board. Out-of-tree, installed to /usr/lib/modules/<kver>/updates.
it87
