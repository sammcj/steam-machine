# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. It covers
# /etc/systemd/system/*.service and *.wants/**, so
# steam-machine-sensors.service and its enable symlink survive on their own.
#
# It covers none of the four below. Without this entry each is silently dropped
# on the next A/B update:
#
#   modprobe.d       `softdep i2c_piix4 post: spd5118`. This is the safety
#                    interlock, not a convenience: the board has no hardware SPD
#                    write protection, and spd5118 holding 0x50-0x57 is the main
#                    thing making userspace writes to the DDR5 SPD hubs return
#                    EBUSY. Losing it silently removes that guard, on a bus that
#                    acpi_enforce_resources=lax has deliberately opened up.
#   default/grub.d   `acpi_enforce_resources=lax`. Without it i2c-piix4 registers
#                    ZERO adapters and there is no SMBus at all.
#   modules-load.d   loads it87 / drivetemp at boot.
#   sensors.d        the verified fan and temperature labels.
#
# Specific files, never the directories: an allowlisted path shadows all future
# upstream versions of it forever, which is fine for files we own outright but a
# trap for a whole directory (/etc/default/grub.d especially).
#
# /etc/atomic-update.conf.d/*.conf is itself on the default keep list, so this
# file preserves itself.
/etc/modprobe.d/steam-machine-sensors.conf
/etc/modules-load.d/steam-machine-sensors.conf
/etc/sensors.d/steam-machine.conf
/etc/default/grub.d/60-steam-machine-smbus.cfg
