# libsensors labels for this build. Installed to /etc/sensors.d/.
#
# Every label below was verified by correlation, not guessed: see the
# idle/load/cool table in ../README.md. Anything that did not move and could
# not be identified is `ignore`d rather than given a speculative name.

# --- Super I/O: ITE IT8696E ---------------------------------------------------
# Out-of-tree it87 driver. The chip is the only source of fan RPM on this board.
# Fan numbering is the driver's, not the silkscreen's -- these are labelled by
# verified function.
chip "it8696-isa-0a40"
    # in0 tracked CPU load 1:1 (0.95 V idle -> 1.24 V all-core -> 0.64 V deep idle).
    label in0          "Vcore"
    # in1-in6 are unscaled ADC rails; Gigabyte's resistor dividers are unknown,
    # so the values are meaningless and in5/in6 trip permanent bogus ALARMs.
    ignore in1
    ignore in2
    ignore in3
    ignore in4
    ignore in5
    ignore in6
    label in7          "3VSB"
    label in8          "Vbat"

    label fan1         "CPU fan (AIO radiator)"
    ignore fan2                     # empty header
    label fan3         "AIO pump"
    label fan5         "Case fan"
    # Defaults are 10 RPM, which alarms on every sane fan.
    set fan1_min 0
    set fan3_min 0
    set fan5_min 0

    ignore temp1                    # flat 19 C under all load -- unconnected
    label temp2        "Board (chipset/M.2 area)"
    label temp3        "CPU (ITE)"  # tracked k10temp Tctl to within 0.2 C
    ignore temp4                    # flat 22 C -- unconnected
    label temp5        "VRM"        # rose 30->42 C on CPU load, with a lag
    ignore temp6                    # reads 0 C -- unconnected

# --- Gigabyte WMI -------------------------------------------------------------
# Exposes the same IT8696E temperatures over ACPI-WMI. Byte-identical to
# it8696 temp1-temp5 at idle, under load and cooling down, so it is pure
# duplication once it87 is loaded. Ignored to keep logs from double-counting.
# If it87 is ever unavailable, comment this block out to get board temps back.
chip "gigabyte_wmi-virtual-0"
    ignore temp1
    ignore temp2
    ignore temp3
    ignore temp4
    ignore temp5

# --- CPU ----------------------------------------------------------------------
chip "k10temp-pci-00c3"
    label temp1        "CPU Tctl"
    label temp3        "CCD1 (die)"

# --- GPU: XFX RX 9070 XT (discrete) -------------------------------------------
chip "amdgpu-pci-0300"
    label temp1        "GPU edge"
    label temp2        "GPU junction"
    label temp3        "GPU VRAM"
    label fan1         "GPU fan"
    label power1       "GPU board power"

# --- GPU: Ryzen 9800X3D iGPU --------------------------------------------------
chip "amdgpu-pci-1100"
    label temp1        "iGPU"

# --- Storage ------------------------------------------------------------------
chip "nvme-pci-0400"
    label temp1        "NVMe composite"    # Biwin NV7400 2TB, boot
    label temp2        "NVMe sensor 1"
    ignore temp3                           # reports a 65261 C high limit; junk

# The two Crucial MX500s (BTRFS RAID1).
#
# Matched by wildcard, not as "drivetemp-scsi-0-0": libsensors has no `scsi`
# bus type, so naming the bus explicitly fails with "Undeclared bus id
# referenced" and aborts the whole config. That is no real loss -- SATA
# enumeration is not stable across reboots, so scsi-0 and scsi-1 can swap and a
# per-drive label would lie. Use bin/sensors-report.sh to map an instance to
# /dev/sdX and its model.
chip "drivetemp-*"
    label temp1        "SATA SSD"

# --- Noise --------------------------------------------------------------------
# ACPI thermal zone reads ~17 C and does not respond to any load. Useless.
chip "acpitz-acpi-0"
    ignore temp1

# Realtek 2.5G NIC PHY. Real, but not interesting for thermal logging.
chip "r8169_0_900:00-mdio-0"
    label temp1        "NIC PHY"
