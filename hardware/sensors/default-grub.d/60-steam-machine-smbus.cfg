# Installed to /etc/default/grub.d/. Sourced by grub-mkconfig, which globs
# ${sysconfdir}/default/grub.d/*.cfg before sourcing /etc/default/grub-steamos.
# Applied to the running system with `update-grub`, which writes
# /efi/EFI/steamos/grub.cfg.
#
# Without this, the FCH SMBus does not exist on this board:
#
#   ACPI Warning: SystemIO range 0x0B00-0x0B08 conflicts with OpRegion
#                 0x0B00-0x0B0F (\GSA1.SMBI)
#   ACPI: OSL: Resource conflict; ACPI support missing from driver?
#
# The firmware declares an ACPI OperationRegion over the SMBus I/O ports, and
# the kernel default (acpi_enforce_resources=strict) makes i2c-piix4 back off
# rather than share. i2c_piix4 loads but registers *zero* adapters, so there is
# no DDR5 DIMM temperature and no path for OpenRGB to ever see the RAM.
#
# `lax` downgrades that refusal to a warning. The tradeoff is real: the host can
# then reach the unprotected SPD EEPROMs, which is why modprobe.d pins spd5118
# ahead of any userspace access. Note that i2c-dev is NOT a second line of
# defence here -- SteamOS loads it itself via its own modules-load.d entries for
# ddcutil and fwupd, so /dev/i2c-* exists whether we want it or not.
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} acpi_enforce_resources=lax"
