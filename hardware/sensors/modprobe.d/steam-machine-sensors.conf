# Installed to /etc/modprobe.d/.

# This platform has NO hardware SPD write protection. i2c-piix4 calls
# i2c_register_spd_write_enable() unconditionally, and unlike Intel's i2c-i801
# there is no SMBHSTCFG_SPD_WD bit for the BIOS to set. The DDR5 SPD EEPROMs at
# 0x50-0x57 are therefore always writable from the host, and on DDR5 the module
# temperature sensor lives *inside* that same SPD hub -- so reading DIMM temps
# means talking to the one address range that can brick the RAM.
#
# spd5118 binding those addresses is the only thing standing in the way: while
# it holds them, ioctl(I2C_SLAVE) from userspace returns EBUSY and i2cdetect
# prints UU. Listing it in modules-load.d is not enough, because i2c-piix4 is
# autoloaded by PCI matching and could win the race, leaving a window where the
# SPD hubs are exposed and unclaimed.
#
# `softdep post` closes that window: the kernel loads spd5118 as part of
# i2c_piix4's own modprobe, before control returns to userspace.
#
# Never unbind spd5118. See ../README.md.
softdep i2c_piix4 post: spd5118

# it87 must not be told to force-bind a chip it did not detect. The IT8696E on
# this board is recognised natively (verified: "Found IT8696E chip at 0xa40"),
# so no force_id is set -- a wrong force_id writes to Super I/O registers of a
# chip the driver has misidentified.
