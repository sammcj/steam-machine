# Installed to /etc/modprobe.d/.
#
# Nothing is set here any more. Both parameters this file used to carry are
# converter-era, and 4K120 now runs over the native HDMI port on the FRL kernel
# in ../kernel/ -- see ../README.md, section "Status".
#
# Kept as a file, rather than deleted, because ../install.sh reinstalls it after
# a SteamOS A/B update and this comment is the record of what was tried.

# freesync_pcon_allow_all -- REMOVED 2026-08-06.
#
# It does not exist in mainline. The FRL kernel logs
#   amdgpu: unknown parameter 'freesync_pcon_allow_all' ignored
# on every boot while it is set, which is noise that reads like a fault.
#
# What it did: amdgpu only passes FreeSync/VRR through a DP-to-HDMI protocol
# converter (a "PCON") whose branch device ID is on an internal whitelist.
# Setting it to 1 bypasses that check. Tried on 2026-08-02 with the UGREEN
# 80397 in the chain, and the bypass itself worked --
#
#   [drm] DP-HDMI adapter Freesync PCON whitelist bypassed
#        - Device branch_dev_id : 2818800        (0x2B02F0)
#
# -- but VRR still did not work: `kscreen-doctor -o` reported "Vrr: incapable"
# and debugfs vrr_range stayed "Min: 0  Max: 0". The converter does not pass
# FreeSync through to the TV, so the whitelist was never the binding constraint.
# It was then pinned to 0 because it bought nothing.
#
# Moot now on two counts: the converter is out of the chain, and VRR works
# natively over FRL (40-120 Hz on the C9). If the converter ever comes back as a
# fallback, this parameter still buys nothing -- do not re-add it.
#
# Also worth knowing when reading old notes: a vertical glitching seam appeared
# at 4K120 during that same 2026-08-02 session. Neither this parameter nor ODM
# combine causes it -- with the parameter at 0, ODM combine is still active at
# 4K120 (two 1920x2160 pipes) and there is no seam. Cause unresolved, never
# recurred, and never seen at all on the native FRL path.

# deep_color -- REMOVED 2026-08-06.
#
# Defaults to 0, which pins HDMI output to 8 bpc ("Deep color disabled. Set
# amdgpu module param deep_color=1 to enable."). It was left unset because it
# only affects the native HDMI encoder and the DP converter was in use. The
# native port is now in use and reports 12 bpc without it, so setting it is
# still unnecessary -- but check `output_bpc` before assuming that after a
# kernel rebase.

# dcfeaturemask -- deliberately NOT set here.
#
# DC_FRL_MASK is bit 10. It must reach ONLY the FRL kernel, so it lives on that
# kernel's own GRUB entry in ../kernel/grub/custom.cfg.in. Putting it in
# modprobe.d would apply it to the stock Valve 6.16 kernel too, where the bit
# does not exist.
#
# Note the value widely quoted online, "amdgpu.dc_feature_mask=0x400", is wrong
# twice over: the parameter is spelled `dcfeaturemask`, and it REPLACES the mask
# rather than OR-ing into it, so it needs to be 0x402 here to preserve the
# existing DC_MULTI_MON_PP_MCLK_SWITCH_MASK (value 2).
