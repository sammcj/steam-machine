# Installed to /etc/modprobe.d/.
#
# freesync_pcon_allow_all=0
#
# Explicitly OFF. This is the driver default, but it is pinned here because the
# obvious thing to do -- turn it on, since the display runs through a DP-to-HDMI
# protocol converter -- was tried on this machine and made things worse.
#
# Background: the RX 9070 XT's HDMI port cannot do 4K120, because this kernel's
# amdgpu has no HDMI 2.1 FRL (verified by extracting amdgpu.ko -- DC_FRL_MASK is
# absent, and every FRL symbol in it belongs to the DP-to-HDMI PCON path). So the
# C9 is driven through an active DisplayPort 1.4 to HDMI 2.1 converter (UGREEN
# 80397) which does the FRL conversion in its own silicon. In DRM terms that is a
# "PCON", and it appears as a DP branch device.
#
# amdgpu only passes FreeSync/VRR through a PCON whose branch device ID is on an
# internal whitelist. This option bypasses that check. Setting it to 1 and
# rebooting produced, on 2026-08-02:
#
#   - The bypass itself worked. The adapter was identified as
#       [drm] DP-HDMI adapter Freesync PCON whitelist bypassed
#            - Device branch_dev_id : 2818800        (0x2B02F0)
#   - VRR still did NOT work: `kscreen-doctor -o` reported "Vrr: incapable" and
#     debugfs vrr_range stayed "Min: 0  Max: 0". The converter does not pass
#     FreeSync through to the TV, so the whitelist was not the binding
#     constraint. Nothing was gained.
# So it is off because it buys nothing, which is reason enough on its own.
#
# A vertical glitching seam also appeared at 4K120 during that session, and an
# earlier version of this comment blamed the parameter for it via ODM combine.
# That was wrong and is retracted: after reverting to 0, ODM combine is STILL
# active at 4K120 (two 1920x2160 pipes) and there is no seam. So ODM alone does
# not cause the artefact, and the parameter was never shown to. The seam's cause
# is unresolved -- that session's compositor type was not recorded, and X11 vs
# Wayland is a live confound on this machine (see README). It has not recurred.
#
# If a future kernel or converter firmware makes VRR actually work, re-enabling
# is worth revisiting -- the C9 supports 40-120 Hz. Check 4K120 for the seam
# when doing so, not because the parameter is known to cause it, but because
# that pairing is the one combination already observed to be bad. See ./README.md.
options amdgpu freesync_pcon_allow_all=0

# NOT set here, deliberately:
#
#   dcfeaturemask   Linux 7.2 adds DC_FRL_MASK = bit 10 to enable native HDMI
#                   2.1 FRL. This kernel (6.16 neptune) does not have that bit,
#                   so setting it would be a no-op. Note also that the value
#                   widely quoted online, "amdgpu.dc_feature_mask=0x400", is
#                   wrong twice over: the parameter is spelled `dcfeaturemask`,
#                   and it REPLACES the mask rather than OR-ing into it, so on
#                   this machine it would need to be 0x402 to preserve the
#                   existing DC_MULTI_MON_PP_MCLK_SWITCH_MASK (value 2).
#
#   deep_color      Defaults to 0, which pins HDMI output to 8 bpc ("Deep color
#                   disabled. Set amdgpu module param deep_color=1 to enable.").
#                   Only affects the native HDMI encoder, not DP, so it does
#                   nothing while the DP converter is in use.
