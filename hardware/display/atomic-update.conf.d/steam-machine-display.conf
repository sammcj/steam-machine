# Installed to /etc/atomic-update.conf.d/.
#
# /etc is an overlayfs whose upper layer lives in /var/lib/overlays/etc/upper,
# so edits survive reboots unconditionally. They do NOT survive a SteamOS A/B
# image update: since 3.6 only an allowlisted subset carries across. The
# default list is /usr/lib/rauc/atomic-update-keep.conf, and it does not
# include /etc/modprobe.d -- so without this entry the amdgpu options below
# would silently vanish on the next OS update and VRR would stop working with
# no obvious cause.
#
# /etc/atomic-update.conf.d/*.conf is itself on the default keep list, so this
# file preserves itself.
#
# Only the one file is listed, not /etc/modprobe.d/*. Allowlisting a path makes
# our copy shadow all future upstream versions of it forever; that is harmless
# for a file we own outright and that no package ships, but it would be a trap
# for the directory as a whole.
/etc/modprobe.d/amdgpu-display.conf

# Same reasoning for the controller-connect trigger: /etc/udev/rules.d is not
# on the default keep list either, so without this line the TV re-detect would
# stop firing after the next OS update -- and the symptom (a black TV on some
# boots) looks exactly like the hardware problem it exists to work around,
# which is the worst kind of silent regression to inherit.
/etc/udev/rules.d/99-steam-machine-display-redetect.rules
