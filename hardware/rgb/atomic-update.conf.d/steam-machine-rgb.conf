# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. It does not
# cover /etc/udev/rules.d, so without this entry the OpenRGB access rule is
# silently dropped on the next A/B update and every RGB controller becomes
# root-only again -- with no error, just LEDs that come back on.
#
# The specific file, never the directory: an allowlisted path shadows all
# future upstream versions of it forever, and /etc/udev/rules.d is a directory
# SteamOS itself ships into.
/etc/udev/rules.d/60-steam-machine-rgb.rules

# The marker recording that SMBus access was granted. install.sh --boot reads it
# to decide whether to reinstall the rule with its SMBus stanza or without, so
# losing it does not fail loudly -- it silently downgrades the machine to
# --no-i2c, OpenRGB stops seeing the DDR5 DIMMs, and the RAM LEDs come back on
# with everything reporting healthy. Exactly that happened on the 2026-08-08
# update (SteamOS 3.8.25).
#
# Harmless when absent: if SMBus access was never granted the file does not
# exist, and rauc simply has nothing to carry.
/etc/udev/rules.d/.steam-machine-rgb-i2c

# Why this is in /etc at all, when upstream's rules file is in
# /usr/lib/udev/rules.d/60-openrgb.rules: that copy is owned by no pacman
# package (`pacman -Qo` says so) -- it was dropped there by hand -- and /usr is
# the one tree a SteamOS A/B update replaces wholesale. It is already living on
# borrowed time. /etc is an overlayfs with its upper layer in /var, so it
# survives reboots unconditionally and, with this entry, OS updates too.
