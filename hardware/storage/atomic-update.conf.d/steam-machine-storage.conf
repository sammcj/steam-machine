# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. It does not
# cover /etc/udev/rules.d, so without this entry the rule that hides the array
# from udisks is silently dropped on the next A/B update -- and the duplicate
# /run/media/deck/<label> mounts come back the first time the drive is clicked
# in Dolphin.
#
# The specific file, never the directory: an allowlisted path shadows all
# future upstream versions of it forever, and /etc/udev/rules.d is a directory
# SteamOS itself ships into.
/etc/udev/rules.d/60-steam-machine-storage.rules

# The default keep list covers /etc/systemd/system/*.{service,socket,mount} and
# *.wants/** -- but NOT *.timer. So an A/B update deletes the dedupe timer while
# keeping the timers.target.wants symlink that points at it: a dangling link, no
# error anywhere, and monthly dedupe silently stops.
/etc/systemd/system/steam-machine-dedupe.timer

# NOT listed here: /etc/fstab, which carries the mount entry for the array and
# is *not* on the default keep list either. Allowlisting it would be the wrong
# fix -- fstab is a file SteamOS owns and reshapes across releases (partsets,
# /efi, /esp), and pinning this machine's copy would silently block every
# future upstream change to it.
#
# Instead `install.sh --boot` re-adds the entry when it finds it missing. See
# steam-machine-storage.service.
