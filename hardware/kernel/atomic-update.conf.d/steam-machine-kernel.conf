# Installed to /etc/atomic-update.conf.d/. Read by SteamOS's atomic updater to
# decide what survives an A/B image swap; the default list is
# /usr/lib/rauc/atomic-update-keep.conf.
#
# Specific files only, never the directory: an allowlisted path shadows all
# future upstream versions of it, permanently.
#
# /etc/systemd/system/*.service is already covered by Valve's default list, so
# this entry is belt-and-braces -- it makes the dependency explicit and keeps
# working if Valve narrow their list later. The unit is the one thing that MUST
# survive, because it is what reinstalls everything else.
#
# /etc/systemd/system/*.timer is NOT on the default list either -- Valve cover
# *.service, *.socket and *.mount and stop there. The .wants symlink for a timer
# IS covered (*.wants/** is listed), so an update that drops the timer leaves an
# enabled-looking dangling symlink and no timer: the kernel cache quietly stops
# updating itself, which is the exact failure the confirm mechanism exists to
# prevent. Both halves of the pair are listed below.
#
# /etc/modprobe.d is NOT on the default list, and mt7902-wifi.conf is the one
# thing standing between this kernel and a power-off that never completes. It
# is also self-healed by install.sh --boot, so losing it costs one hung
# shutdown at worst rather than being permanent -- but there is no reason to
# accept even that.
#
# Deliberately NOT listed:
#
#   /etc/mkinitcpio.d/linux-frlprobe.preset  -- rewritten by install.sh --boot
#   /efi/EFI/steamos/custom.cfg              -- on the per-slot EFI partition,
#                                               which the updater replaces
#                                               wholesale; also rewritten, and
#                                               regenerated with the *new*
#                                               slot's rootfs UUID, which a
#                                               preserved copy would get wrong.
/etc/systemd/system/steam-machine-kernel.service
/etc/systemd/system/multi-user.target.wants/steam-machine-kernel.service
/etc/atomic-update.conf.d/steam-machine-kernel.conf
/etc/modprobe.d/mt7902-wifi.conf
/etc/systemd/system/steam-machine-shutdown-vt.service
/etc/systemd/system/multi-user.target.wants/steam-machine-shutdown-vt.service
/etc/systemd/system/steam-machine-kernel-confirm.service
/etc/systemd/system/steam-machine-kernel-confirm.timer
/etc/systemd/system/timers.target.wants/steam-machine-kernel-confirm.timer
