# Installed to /etc/atomic-update.conf.d/. Read by SteamOS's atomic updater to
# decide what survives an A/B image swap; the default list is
# /usr/lib/rauc/atomic-update-keep.conf.
#
# Specific files only, never the directory: an allowlisted path shadows all
# future upstream versions of it, permanently.
#
# /etc/systemd/system/*.service is already covered by Valve's default list, so
# this entry is belt-and-braces -- it makes the dependency explicit and keeps
# working if Valve narrow their list later. The unit is the one thing that MUST
# survive, because it is what reinstalls everything else.
#
# Deliberately NOT listed:
#
#   /etc/mkinitcpio.d/linux-frlprobe.preset  -- rewritten by install.sh --boot
#   /efi/EFI/steamos/custom.cfg              -- on the per-slot EFI partition,
#                                               which the updater replaces
#                                               wholesale; also rewritten, and
#                                               regenerated with the *new*
#                                               slot's rootfs UUID, which a
#                                               preserved copy would get wrong.
/etc/systemd/system/steam-machine-kernel.service
/etc/systemd/system/multi-user.target.wants/steam-machine-kernel.service
/etc/atomic-update.conf.d/steam-machine-kernel.conf
