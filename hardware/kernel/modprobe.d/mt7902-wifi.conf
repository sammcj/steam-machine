# Onboard MediaTek MT7902 Wi-Fi (PCI 14c3:7902). Blacklisted because binding it
# hangs every power-off on this kernel.
#
# This is the cause of the S5 hang documented in ../README.md. The whole chain:
#
#   1. Mainline 7.2 added MT7902 to mt7921e's PCI ID table
#      (c26319afb5fb "wifi: mt76: mt7921: add MT7902 PCIe device support"),
#      so the driver binds a device it never used to touch. No Valve kernel
#      carries that ID -- 6.16 matched 14c3:7920 only, and 6.18.42 adds 7922
#      and 7961 but still not 7902 -- which is why the stock kernel powers off
#      cleanly and this one does not.
#
#      RE-CHECK AFTER EVERY SteamOS KERNEL BUMP:
#        modinfo -F alias mt7921e | grep 7902
#      The day Valve ship a kernel carrying 7902, stock inherits the same hang
#      and this file becomes what prevents it there too.
#
#   2. Probe then fails: MediaTek have never shipped MT7902 Wi-Fi firmware to
#      linux-firmware, so WIFI_RAM_CODE_MT7902_1.bin and
#      WIFI_MT7902_patch_mcu_1_1_hdr.bin both load with -ENOENT and the driver
#      logs "hardware init failed". There is no wlan interface, and no
#      prospect of one -- only the *Bluetooth* blob (BT_RAM_CODE_MT7902_1_1_hdr.bin)
#      is published, and that half works fine over USB via btusb_mt7902.
#
#   3. The device stays bound to mt7921e regardless of the failed probe.
#
#   4. mt7921_pci_shutdown() is just a call to mt7921_pci_remove() -- a full
#      teardown with firmware MCU handshakes. Run against a device whose MCU
#      was never brought up, it waits forever on a reply that cannot come.
#      device_shutdown() never returns, so kernel_power_off() never reaches
#      pr_emerg("Power down\n") and the rails never drop.
#
# Blacklisting stops udev's alias-based autoload, which is the only thing that
# loads this driver; nothing else depends on it. `install mt7921e /bin/false`
# would be stricter but would also block loading it by hand, and being able to
# do that is useful if MediaTek ever publish the Wi-Fi firmware.
#
# This does NOT affect Bluetooth. That is a separate USB device (0e8d:7902,
# hci0) driven by the out-of-tree btusb_mt7902 -- see ../../bluetooth/. Same
# chip, same "7902" in the ID, different bus and different driver.
blacklist mt7921e
