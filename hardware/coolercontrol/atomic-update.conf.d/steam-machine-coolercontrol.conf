# Installed to /etc/atomic-update.conf.d/.
#
# Since SteamOS 3.6 only an allowlisted subset of /etc carries into a new OS
# image; the default list is /usr/lib/rauc/atomic-update-keep.conf. It covers
# /etc/systemd/system/*.service and *.wants/**, so coolercontrold.service and
# its enable symlink survive on their own.
#
# It does not cover /etc/coolercontrol. Without this entry the daemon's entire
# configuration is silently dropped on the next A/B update, taking with it:
#
#   config.toml       `apply_on_boot = false` -- the setting that keeps this a
#                     monitoring-only install and leaves the board's fan curves
#                     with the BIOS. Losing it is the one failure here that is
#                     more than cosmetic: the daemon would come back with the
#                     upstream default of true and reapply any saved profiles.
#   config-ui.json    channel renames and hidden channels. CoolerControl reads
#                     hwmon directly and ignores /etc/sensors.d, so these are
#                     the only place the verified it8696 labels exist for it.
#   .passwd           the UI password, if changed from the default.
#   alerts.json, modes.json, calibrations.json, *-bak.*
#
# The daemon's own state (/var/lib/coolercontrol) needs no entry -- /var is a
# separate partition, not part of the A/B image.
#
# A wildcard here, unlike the other subsystems in this repo, where the rule is
# specific files only. That rule exists because an allowlisted path shadows all
# future upstream versions of it forever -- a real trap for a directory like
# /etc/modprobe.d that SteamOS also ships into. Nothing ships /etc/coolercontrol:
# it is created by a daemon installed from a standalone binary, no pacman
# package owns it, and there is no upstream version to shadow. Listing files
# individually would instead mean silently losing any new state file a future
# CoolerControl release adds, since the daemon creates them itself.
#
# /etc/atomic-update.conf.d/*.conf is itself on the default keep list, so this
# file preserves itself.
/etc/coolercontrol/*
