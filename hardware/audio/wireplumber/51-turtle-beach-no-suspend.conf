# Turtle Beach Stealth 600P Gen 3 (USB 2.4 GHz dongle, 10f5:2242)
#
# WirePlumber's node/suspend-node.lua suspends any idle Audio node after a
# hardcoded 5 s default. Valve override that for the internal cards via the
# valve-jupiter/valve-fremont hardware profiles, but those rules match
# alsa.card_name = "HD-Audio Generic", so a USB headset inherits the 5 s.
#
# Suspending closes the ALSA device, which stops the USB isochronous stream.
# Re-opening it makes the dongle re-sync its 2.4 GHz link to the headset
# (logged as "cannot set freq 48000 to ep 0x81"), which is audible as a drop
# whenever a game leaves the sink idle for >5 s - menus, loading screens.
#
# 0 disables the suspend entirely; suspend-node.lua returns early on 0.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Turtle_Beach_Corp_Stealth_600P.*"
      }
      {
        node.name = "~alsa_input.usb-Turtle_Beach_Corp_Stealth_600P.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
